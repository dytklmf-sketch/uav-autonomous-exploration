common:
    lid_topic:  "/livox/lidar"
    imu_topic:  "/livox/imu"          # launch 里 remap 到 /drone_0/cj02/imu/data_raw
    time_sync_en: false
    time_offset_lidar_to_imu: 0.0

preprocess:
    lidar_type: 1                # Livox serials
    scan_line: 4
    blind: 0.5

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    360
    det_range:     100.0
    extrinsic_est_en:  true      # 先在线估计 CJ02-雷达外参 (初始旋转需大致对)
    extrinsic_T: [0.00205, -0.02149, 0.06168]      # 双IMU标定 2026-09-21 (bag: calib_dual_imu_20260921_181835)
    extrinsic_R: [ 0.99993, 0.01110, 0.00398,
                   -0.01117, 0.99979, 0.01740,
                   -0.00379, -0.01745, 0.99984 ]

publish:
    path_en:  false
    scan_publish_en:  true
    dense_publish_en: true
    scan_bodyframe_pub_en: true

pcd_save:
    pcd_save_en: false
    interval: -1
